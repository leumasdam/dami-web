<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vlastná výroba – kuchárske nohavice a zástery | DAMI Piešťany</title>
<meta name="description" content="DAMI je rodinný obchod v Piešťanoch. Okrem značkového oblečenia si časť sortimentu šijeme sami: kuchárske nohavice a zástery. Nohavice skrátime v rámci ceny.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/dami.css">
<link rel="stylesheet" href="css/dami2.css?v=1121d">
<link rel="stylesheet" href="css/sub.css">
<link rel="stylesheet" href="css/hero.css?v=1121a">
<link rel="stylesheet" href="css/vyroba.css">
<link rel="preload" as="image" href="img/vyroba-hero.webp">
<script src="../data/catalog.js"></script>
<script src="js/packshots.js"></script>
<script src="js/dami.js?v=1121c"></script>
<script src="js/xmas.js?v=1121g" defer></script>
</head>
<body>
<script>DAMI.mount("light", "")</script>

<main>
  <div data-hero></div>

  <section class="wrap vy-steps" aria-label="Ako vzniká" data-steps></section>

  <section class="wrap sub-sec vy-own" id="nase">
    <h2 class="h2x">Naša vlastná výroba</h2>
    <div class="hrow" data-own></div>
  </section>

  <section class="wrap vy-band-w">
    <div class="band vy-band">
      <h2>Potrebujete inú dĺžku alebo farbu? Ozvite sa.</h2>
      <p>Nohavice vám skrátime v rámci ceny. Napíšte nám alebo sa zastavte v predajni na Gaštanovej.</p>
      <a class="btn btn--white bx" data-mail>Napísať nám</a>
      <img class="band__hand" src="img/hand-white.svg" alt="" width="458" height="600">
    </div>
  </section>
</main>

<script>
(() => {
  const { P, ico, eur, esc, prodUrl, catUrl, FIRM } = DAMI;
  const $ = s => document.querySelector(s);
  const arrowSvg = ico("arrow", "");
  $("[data-steps]").innerHTML = [
    ["#nase", "Látka", "img/foto-latka.webp", "Rolky čiernej, bielej a kockovanej látky v dielni"],
    ["#nase", "Strih", "img/foto-strih.webp", "Krajčírska krieda a strih na čiernej látke"],
    [catUrl("zastery-a-plaste"), "Hotový kus", "img/foto-hotovy.webp", "Hotová čierna zástera na drevenom stole"],
  ].map(([h, t, img, alt], i) => `<a class="ptile rv" data-d="${i * 70}" href="${h}"><img src="${img}" alt="${alt}" loading="lazy"><b>${t}</b><span class="go">${arrowSvg}</span></a>`).join("");

  const nice = n => n.replace(/\s+-\s+/g, " ");
  const hc = p => `<article class="hc rv" data-id="${esc(p.id)}">
      <div class="hc__img"><img src="${p.img[0]}" alt="${esc(nice(p.name))}" loading="lazy"></div>
      <div class="hc__b"><h3 class="hc__n"><a href="${prodUrl(p.id)}">${esc(nice(p.name))}</a></h3>
        ${p.sizes.length ? `<div class="hc__sz" aria-label="Veľkosti">${p.sizes.slice(0, 5).map(z => `<i>${esc(z)}</i>`).join("")}${p.sizes.length > 5 ? `<i>+${p.sizes.length - 5}</i>` : ""}</div>` : ""}
        <div class="hc__p">${eur(p.price)}</div>
        <button class="hc__add" data-quick="${esc(p.id)}">${ico("cart2", "")} Do košíka</button></div></article>`;
  $("[data-own]").innerHTML = ["zastera-na-krk-cierna-dlha", "zastera-do-pasa-cierna-kratka-s-vreckom", "kucharske-nohavice-pepito", "kucharske-nohavice-biele"]
    .filter(id => P[id]).map(id => hc(P[id])).join("");

  const m = $("[data-mail]");
  m.href = `mailto:${FIRM.mail}?subject=${encodeURIComponent("Vlastná výroba – úprava dĺžky alebo farby")}`;
  m.insertAdjacentHTML("beforeend", " " + ico("arrow"));
})();
</script>
<script>
(() => {
  const { P, eur, FIRM, heroB } = DAMI;
  const own = ["zastera-na-krk-cierna-dlha", "zastera-do-pasa-cierna-kratka-s-vreckom", "kucharske-nohavice-pepito", "kucharske-nohavice-biele"].map(id => P[id]).filter(Boolean);
  const lo = Math.min(...own.map(p => p.price));
  document.querySelector("[data-hero]").outerHTML = heroB({
    crumbs: [["index.html", "Domov"], ["", "Vlastná výroba"]], eye: "Vlastná výroba",
    h1: "Šijeme kuchárske nohavice a&nbsp;zástery.",
    name: "Z našej dielne od", price: eur(lo),
    lead: "DAMI je rodinný obchod v Piešťanoch. Okrem značkového oblečenia si časť sortimentu šijeme sami.",
    btns: [["#nase", "Naše výrobky"], ["mailto:" + FIRM.mail + "?subject=" + encodeURIComponent("Vlastná výroba – úprava dĺžky alebo farby"), "Napísať nám", "ghost"]],
    trust: ["Nohavice skrátime v rámci ceny", "Predajňa na Gaštanovej v Piešťanoch"],
    photo: "img/vyroba-hero.webp", pos: "50% 50%", alt: "Šitie tmavomodrej látky na šijacom stroji v dielni" });
})();
</script>
<script>DAMI.mountFooter()</script>
</body>
</html>
