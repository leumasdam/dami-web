<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAMI – makety hero sekcií</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF8F5; color: #141414; font: 16px/1.5 Figtree, system-ui, sans-serif; }
  header { padding: 28px max(16px, 4vw) 8px; }
  h1 { font-size: 28px; margin: 0; }
  header p { margin: 6px 0 0; color: #5E5953; max-width: 70ch; }
  main { padding: 16px max(16px, 4vw) 60px; display: grid; gap: 40px; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  figcaption { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  figcaption b { font-size: 20px; }
  figcaption a { color: #E1251B; font-weight: 600; }
  figcaption span { color: #5E5953; }
</style>
</head>
<body>
<header>
  <h1>Makety hero sekcií kategórie</h1>
  <p>Vygenerované v Higgsfielde zo schválených fotiek a štýlu pôvodných makiet. Pod každou maketou je odkaz na rovnaký layout postavený na webe.</p>
</header>
<main>
  <figure><img src="gastro-a-kampan.png" alt="Maketa A Kampaň – Gastro" width="1344" height="752">
    <figcaption><b>A · Kampaň</b><span>fotka cez celú šírku, ponuka v karte, podkategórie s fotkami</span><a href="../kategoria.html?c=gastro&amp;hero=a">Na webe →</a></figcaption></figure>
  <figure><img src="gastro-b-split.png" alt="Maketa B Split – Gastro" width="1344" height="752">
    <figcaption><b>B · Split</b><span>červený panel s ponukou a cenou, fotka do kraja, podkategórie s fotkami</span><a href="../kategoria.html?c=gastro&amp;hero=b">Na webe →</a></figcaption></figure>
  <figure><img src="gastro-c-produkt.png" alt="Maketa C Produkt – Gastro" width="1344" height="752">
    <figcaption><b>C · Produkt</b><span>veľký produkt s cenovkou a parametrami, najpredávanejšie vedľa</span><a href="../kategoria.html?c=gastro&amp;hero=c">Na webe →</a></figcaption></figure>
  <figure><img src="pracovne-a-kampan.png" alt="Maketa A Kampaň – Pracovné odevy" width="1344" height="752">
    <figcaption><b>A · Kampaň – Pracovné odevy</b><span>zimné bundy od 27,90 €</span><a href="../kategoria.html?c=pracovne&amp;hero=a">Na webe →</a></figcaption></figure>
