<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produkt | DAMI pracovné odevy</title>
<meta name="description" content="Pracovné oblečenie, gastro a zdravotnícke odevy, obuv a doplnky. Online aj v našej predajni v Piešťanoch.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/dami.css">
<link rel="stylesheet" href="css/dami2.css?v=1121r">
<link rel="stylesheet" href="css/produkt.css">
<script src="../data/catalog.js"></script>
<script src="js/dami.js?v=1121c"></script>
<script src="js/xmas.js?v=1121t" defer></script>
</head>
<body class="pg-prod">
<script>
  window.PROD = DAMI.P[DAMI.qp("p")];
  DAMI.mount("dark", PROD ? PROD.sec[0] : "");
</script>

<main data-page></main>
<div class="lb" data-lb><img alt=""></div>

<script>
(() => {
  const { D, ico, esc, eur, catUrl, prodUrl, catProducts, secProducts, FIRM, addToCart, isFav, toggleFav, toast, brandLabel, shortName } = DAMI;
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const p = window.PROD;
  if (!p) {
    $("[data-page]").innerHTML = `<div class="wrap missing"><h1 class="h-l">Produkt sme nenašli</h1><p class="muted">Možno bol medzičasom vypredaný alebo sa zmenila adresa. Pozri si naše kolekcie alebo nám zavolaj na ${FIRM.phone}.</p><a class="btn btn--red" href="${catUrl("gastro")}">Pozrieť kolekcie ${ico("arrow")}</a></div>`;
    return;
  }
  document.title = `${p.name} | DAMI pracovné odevy`;

  /* ---------- odvodené texty (len z dát katalógu) ---------- */
  const sec = p.sec[0] || "gastro";
  const roots = Object.values(D.sections).map(s => s.root);
  const cat = p.cats.find(k => D.cats[k] && !roots.includes(k) && !k.startsWith("zdrav-")) || p.cats.find(k => D.cats[k]) || "";
  /* popisy zo starého webu majú zlepené položky zoznamu („VlastnostiOdolná…“) – rozdelíme ich */
  const unglue = t => t.split(/(?<=[a-záäčďéíĺľňóôŕšťúýž0-9%).])(?=[A-ZÁÄČĎÉÍĹĽŇÓÔŔŠŤÚÝŽ][a-záäčďéíĺľňóôŕšťúýž])/);
  const JUNK = /^(dokumenty|vlastnosti|popis|parametre( tovaru)?|detaily|materiály?|popis a [^:]*):?$/i;
  const lines = p.desc.flatMap(d => d.split(/\n+/)).flatMap(unglue).map(l => l.replace(/^[\s\-–•·*]+/, "").replace(/\s+/g, " ").trim())
    .filter(l => !JUNK.test(l)).filter(l => l.length > 1 && l.toLowerCase() !== p.name.toLowerCase());
  /* parametre „Kľúč hodnota“ */
  const KEYS = ["Materiálové zloženie", "Vrchný materiál", "Materiál", "Zloženie", "Gramáž", "Podšívka", "Reflexné doplnky", "Kapucňa", "Normy", "Norma", "Certifikáty", "Rozdelenie", "Farebnosť", "Sezóna", "Typ obuvi", "Typ aplikácie", "Stupeň ochrany", "Prevedenie", "Podošva", "Vkladacia stielka", "Stielka", "Určené do", "Odbor", "Etiketa", "Pranie na", "Veľkosť", "Značka", "Kategória", "Bezpečnostné informácie", "Výrobca / Dodávateľ"];
  const SKIP = /^(Veľkosť|Značka|Kategória|Bezpečnostné informácie|Výrobca \/ Dodávateľ)$/i;
  const specs = [], rest = [];
  lines.forEach(l => {
    const k = KEYS.find(k => l.toLowerCase().startsWith(k.toLowerCase() + " ") || l.toLowerCase().startsWith(k.toLowerCase() + ":"));
    if (k && l.length < 160) { const v = l.slice(k.length).replace(/^[:\s]+/, ""); if (v && !SKIP.test(k)) specs.push([k, v]); }
    else if (!KEYS.some(k => l.replace(/:$/, "").toLowerCase() === k.toLowerCase())) rest.push(l);
  });
  const longLine = rest.find(l => l.length > 90);
  const sentences = (longLine || "").match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g)?.map(s => s.trim()).filter(s => s && !/^poznámka/i.test(s)) || [];
  let lead = sentences[0] || "";
  if (lead.length < 70 && sentences[1]) lead += " " + sentences[1];
  const shortLines = rest.filter(l => l !== longLine && l.length <= 120 && l.length > 3 && !/^poznámka|^ak by/i.test(l));
  const bullets = (shortLines.length >= 2 ? shortLines : sentences.slice(lead === sentences[0] ? 1 : 2).filter(s => s.length < 200)).slice(0, 6);
  if (!lead) lead = `${p.name} z kategórie ${D.cats[cat]?.name.toLowerCase() || "pracovné odevy"}. Radi ti poradíme s veľkosťou aj výberom a vyskúšať si ho môžeš v našej predajni v Piešťanoch.`;
  const matSpecs = specs.filter(([k, v]) => /materi|zlože|gramáž|podšív|pranie|podošva|stielka/i.test(k) || /%|g\/m/.test(v));
  const matLines = rest.filter(l => /materi|%|g\/m|pran|°C|bavln|polyester|elastan|koža|podrážk|podošv/i.test(l) && l !== longLine && l.length < 200);
  const sale = p.was > p.price && p.price > 0;
  const onRequest = !p.price;
  const brand = brandLabel(p);
  const nm = (n => n.charAt(0).toUpperCase() + n.slice(1))(p.brand && p.name.toLowerCase().startsWith(p.brand.toLowerCase() + " ") ? p.name.slice(p.brand.length + 1) : shortName(p));

  /* ---------- markup ---------- */
  const crumbs = [["index.html", "Domov"], [sec === "zdravotnictvo" ? "zdravotnictvo.html" : catUrl(sec), D.sections[sec]?.name.replace(/ a biele odevy$/, "") || "Produkty"]];
  if (cat) crumbs.push([catUrl(cat), D.cats[cat].name]);
  const backUrl = crumbs.at(-1)[0];
  const vt = (() => { try { const v = sessionStorage.getItem("dami-vt") === p.id; sessionStorage.removeItem("dami-vt"); return v; } catch { return false; } })();
  const imgs = p.img.length ? p.img : ["../assets/img/logo-light.png"];
  const mailQ = `mailto:${FIRM.mail}?subject=${encodeURIComponent("Cena: " + p.name)}&body=${encodeURIComponent("Dobrý deň,\nzaujíma ma cena produktu " + p.name + ".\n" + location.href)}`;
  const priceHtml = onRequest ? `<b>Cena na dopyt</b>` : `<b>${eur(p.price)}</b>${sale ? `<s>${eur(p.was)}</s>` : ""}<small>s DPH</small>`;
  const addBtn = (cls = "") => onRequest ? `<a class="btn btn--red btn--add ${cls}" href="${mailQ}">${ico("mail")} Opýtať sa na cenu</a>` : `<button class="btn btn--red btn--add ${cls}" data-add>${ico("cart")} Do košíka</button>`;

  /* hodí sa k tomu: po jednom produkte z ďalších podkategórií tej istej sekcie */
  const fit = []; const seen = new Set([p.id]);
  const okFit = x => !seen.has(x.id) && x.price && x.img.length && !x.cats.includes(cat);
  const subPick = (D.sections[sec]?.subs || []).filter(k => k !== cat).map(k => { const l = catProducts(k).filter(okFit); return l.find(x => p.brand && x.brand === p.brand) || l[0]; }).filter(Boolean);
  /* najprv kúsky tej istej značky (napr. CHEFLINE rondon → CHEFLINE zástera, čiapka) */
  subPick.sort((a, b) => (b.brand === p.brand) - (a.brand === p.brand)).forEach(x => { if (fit.length < 4 && !seen.has(x.id)) { fit.push(x); seen.add(x.id); } });
  [...catProducts(cat), ...secProducts(sec)].forEach(x => { if (fit.length < 4 && !seen.has(x.id) && x.price && x.img.length) { fit.push(x); seen.add(x.id); } });
  const fitCard = x => `<article class="pc fitc" data-id="${esc(x.id)}">
      <div class="pc__img fitc__img"><img src="${x.img[0]}" alt="${esc(x.name)}" loading="lazy" decoding="async"></div>
      <div class="fitc__b"><h3 class="pc__name"><a href="${prodUrl(x.id)}">${esc(x.name)}</a></h3>
        ${x.sizes.length ? `<div class="fitc__sz">${x.sizes.slice(0, 5).map(z => `<i>${esc(z)}</i>`).join("")}${x.sizes.length > 5 ? `<i class="m">+${x.sizes.length - 5}</i>` : ""}</div>` : ""}
        <div class="fitc__price">${eur(x.price)}${x.was > x.price ? `<s>${eur(x.was)}</s>` : ""}</div>
        <button class="pc__add" data-quick="${esc(x.id)}">${ico("cart2")} Do košíka</button></div></article>`;

  const STK = `<a class="pstk" href="predajna.html" aria-label="Príď si ho vyskúšať do predajne v Piešťanoch"><img src="img/hand-white.svg" alt="" width="458" height="600"><span>Príď si ${sec === "obuv" ? "ju" : "ho"}<br>vyskúšať</span>
    <svg viewBox="0 0 160 16" aria-hidden="true"><path d="M3 11c30-5 70-8 150-7" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round"/></svg></a>`;

  $("[data-page]").innerHTML = `
  <div class="wrap ptop">
    <nav class="crumbs" aria-label="Omrvinky">${crumbs.map(([h, t], i) => `<a href="${h}">${esc(t)}</a>${i < crumbs.length - 1 ? "<span>/</span>" : ""}`).join("")}</nav>
    <a class="pback" href="${backUrl}">${ico("arrow")}<span>Späť na produkty</span></a>
  </div>
  <section class="wrap pd">
    <div class="gal">
      <div class="stage" data-stage>
        <div class="stage__track" data-gal>${imgs.map((s, i) => `<div class="stage__slide"><img src="${s}" alt="${i ? "" : esc(p.name)}" ${i ? 'loading="lazy"' : `data-main fetchpriority="high" ${vt ? 'style="view-transition-name:pimg"' : ""}`}></div>`).join("")}</div>
        <button class="stage__fav ${isFav(p.id) ? "is-on" : ""}" data-pfav aria-label="Pridať k obľúbeným" aria-pressed="${isFav(p.id)}">${ico("heart")}</button>
        ${imgs.length > 1 ? `<div class="stage__dots">${imgs.map((_, i) => `<button class="${i ? "" : "is-on"}" data-img="${i}" aria-label="Fotografia ${i + 1}"></button>`).join("")}</div>` : ""}
      </div>
      ${imgs.length > 1 ? `<div class="thumbs" aria-label="Fotografie">${imgs.map((s, i) => `<button class="thumb ${i ? "" : "is-on"}" data-img="${i}" aria-label="Fotografia ${i + 1}"><img src="${s}" alt=""></button>`).join("")}</div>` : ""}
    </div>
    <div class="info">
      <span class="info__brand">${esc(brand)}</span>
      <h1>${esc(nm)}</h1>
      <div class="price ${sale ? "is-sale" : ""}">${priceHtml}</div>
      <div id="vyber"></div>
      ${p.colors.length ? `<div class="opt" data-opt="color"><div class="opt__hd"><b>Farba</b><span data-color-name>${p.colors.length === 1 ? esc(p.colors[0].n) : ""}</span><span class="opt__err">Vyber farbu</span></div>
        <div class="swb">${p.colors.map((c, i) => `<button class="${p.colors.length === 1 ? "is-on" : ""}" data-color="${i}" title="${esc(c.n)}" aria-label="${esc(c.n)}" style="background:${c.h.length > 1 ? `linear-gradient(135deg,${c.h[0]} 50%,${c.h[1]} 50%)` : c.h[0]}"></button>`).join("")}</div></div>` : ""}
      ${p.sizes.length ? `<div class="opt" data-opt="size"><div class="opt__hd"><b>Veľkosť</b><span class="opt__err">Vyber veľkosť</span><button class="sztab" data-tabgo="size">Tabuľka veľkostí</button></div>
        <div class="szb">${p.sizes.map((s, i) => `<button class="${p.sizes.length === 1 ? "is-on" : ""}" data-size="${i}" aria-pressed="${p.sizes.length === 1}">${esc(s)}</button>`).join("")}</div></div>` : ""}
      ${p.price ? `<div class="opt" data-opt="logo"><div class="opt__hd"><b>Logo firmy</b><span class="opt__note">cenu potvrdíme podľa loga</span></div>
        <div class="lgo"><button class="is-on" data-logo="" aria-pressed="true">Bez loga</button>${DAMI.LOGO_OPT.map(([k, ic]) => `<button data-logo="${k}" aria-pressed="false">${ico(ic)}${DAMI.logoName(k)}</button>`).join("")}</div>
        <div class="lgo-up" data-lgo-up hidden>
          <label class="lgo-file"><input type="file" accept="image/*,.pdf,.ai,.eps,.svg" data-lgo-file>${ico("upload")}<span data-lgo-fname><b>Priložiť logo alebo predlohu</b><small>PNG, JPG, PDF, SVG, AI · aj fotka či skica</small></span></label>
          <textarea data-lgo-note rows="2" maxlength="300" placeholder="Predstava: kde má byť logo (hruď, chrbát, rukáv), veľkosť, farby…"></textarea>
          <p class="lgo-hint">Logo môžete poslať aj neskôr na ${FIRM.mail}. Pred výrobou vám pošleme náhľad a cenu na potvrdenie.</p>
        </div></div>` : ""}
      <div class="buy">
        <span class="buy__lab">Množstvo</span>
        <div class="buy__row"><div class="qty"><button data-qd="-1" aria-label="Menej">−</button><input data-qty value="1" inputmode="numeric" aria-label="Množstvo"><button data-qd="1" aria-label="Viac">+</button></div>
        ${addBtn()}</div>
      </div>
      <a class="btn rez" href="mailto:${FIRM.mail}" data-rez>${ico("store")} Rezervovať na vyskúšanie v predajni</a>
      <p class="avail"><i></i>Osobný odber v predajni ${esc(FIRM.street)}</p>
      <p class="dlv">${ico("truck")}<span>Objednaj dnes, doručíme zvyčajne do <b>${DAMI.deliveryDate()}</b> · nad ${DAMI.FREE} € zadarmo</span></p>
      <div class="pacc" data-acc></div>
      <ul class="bens">
        <li>${ico("truck")}Doručenie po Slovensku</li>
        <li>${ico("headset")}<span>Poradíme s veľkosťou: <a href="tel:${FIRM.phone.replace(/\s/g, "")}">${FIRM.phone}</a></span></li>
        <li>${ico("refresh")}Vrátenie tovaru do 14 dní</li>
        <li>${ico("store")}Veľkosť si vyskúšaš v našej predajni v Piešťanoch</li>
      </ul>
      <div class="ptrust">${DAMI.gBadge()}${DAMI.hBadge()}</div>
    </div>
  </section>

  <section class="wrap ptabs">
    <div class="tabs" role="tablist">
      <button class="tab is-on" data-tab="desc" role="tab" aria-selected="true">Popis</button><button class="tab" data-tab="mat" role="tab" aria-selected="false">Materiál a starostlivosť</button><button class="tab" data-tab="size" role="tab" aria-selected="false">Veľkosti</button><button class="tab" data-tab="ship" role="tab" aria-selected="false">Doprava</button><button class="tab" data-tab="ret" role="tab" aria-selected="false">Vrátenie a výmena</button>
    </div>
    <div class="ptabs__body"><div class="panel" data-panel role="tabpanel"></div>${STK}</div>
  </section>

  ${fit.length ? `<section class="wrap fit"><h2>Hodí sa k tomu</h2><div class="fit__row">${fit.map(fitCard).join("")}</div></section>` : ""}

  <div class="pbar"><div class="pbar__p ${sale ? "is-sale" : ""}">${onRequest ? "Cena na dopyt" : eur(p.price)}</div>${addBtn("pbar__btn")}</div>`;

  /* ---------- taby / akordeón ---------- */
  const tel = `<a href="tel:${FIRM.phone.replace(/\s/g, "")}"><b>${FIRM.phone}</b></a>`;
  const specList = list => list.length ? `<dl class="spec">${list.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : "";
  const PANELS = {
    ship: () => `<div class="pp"><div class="pp__main"><table class="shiptab"><tbody>
      <tr><td>Osobný odber v predajni ${esc(FIRM.street)}</td><td>zadarmo</td></tr>
      <tr><td>Packeta, výdajné miesto alebo box</td><td>2,90 €</td></tr>
      <tr><td>Kuriér na adresu</td><td>3,90 €</td></tr>
      <tr><td>Dobierka</td><td>+1,50 €</td></tr></tbody></table>
      <p>Nad ${DAMI.FREE} € je doprava Packetou aj kuriérom zadarmo. Doručenie zvyčajne do 2–3 pracovných dní.</p></div>
      <div class="pp__side"><h3>Odber v Piešťanoch</h3><p>Objednávku si môžeš vyzdvihnúť v predajni Po–Pi 9:30–17:00 a So 9:00–12:00 a rovno si ju vyskúšať.</p></div></div>`,
    ret: () => `<div class="pp"><div class="pp__main"><p>Tovar kúpený cez e-shop môžeš vrátiť do 14 dní bez udania dôvodu. Stačí vyplniť formulár a poslať balík alebo ho priniesť do predajne.</p>
      <p>Pri reklamácii platí záruka 24 mesiacov. Reklamáciu vybavíme najneskôr do 30 dní.</p></div>
      <div class="pp__side"><h3>Nesedí veľkosť?</h3><p>Príď do predajne na ${esc(FIRM.street)}, vyskúšaš si inú veľkosť na mieste. Alebo nám zavolaj na ${tel}.</p></div></div>`,
    desc: () => `<div class="pp"><div class="pp__main"><p class="pp__lead">${esc(lead)}</p>${bullets.length ? `<ul class="dots">${bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div>
      ${specs.length ? `<div class="pp__side"><h3>Parametre</h3>${specList(specs.slice(0, 8))}</div>` : ""}</div>`,
    mat: () => `<div class="pp"><div class="pp__main">${matSpecs.length ? specList(matSpecs) : ""}${matLines.filter(l => !matSpecs.some(([k, v]) => l.includes(v))).slice(0, 6).map(l => `<p>${esc(l)}</p>`).join("")}
      ${!matSpecs.length && !matLines.length ? `<p>Zloženie materiálu je uvedené na etikete výrobku. Ak ho potrebuješ vedieť vopred, zavolaj nám na ${tel}.</p>` : ""}</div>
      <div class="pp__side"><h3>Starostlivosť</h3><p>Pri praní a žehlení sa riaď symbolmi na etikete výrobcu. S výberom materiálu pre tvoju prevádzku ti radi poradíme v predajni.</p></div></div>`,
    size: () => `<div class="pp"><div class="pp__main">${p.sizes.length ? `<p>Dostupné veľkosti tohto produktu:</p><div class="szlist">${p.sizes.map(s => `<i>${esc(s)}</i>`).join("")}</div>` : "<p>Tento produkt sa predáva v univerzálnej veľkosti.</p>"}</div>
      <div class="pp__side"><h3>Nevieš veľkosť?</h3><p>Presné miery sa líšia podľa výrobcu. Zavolaj nám na ${tel} alebo si produkt príď vyskúšať do predajne na ${esc(FIRM.street)} v Piešťanoch.</p></div></div>`,
  };
  const panel = $("[data-panel]");
  const showTab = t => { $$("[data-tab]").forEach(b => { b.classList.toggle("is-on", b.dataset.tab === t); b.setAttribute("aria-selected", b.dataset.tab === t); }); panel.innerHTML = PANELS[t](); };
  showTab("desc");
  $("[data-acc]").innerHTML = [["desc", "Popis"], ["mat", "Materiál a starostlivosť"], ["size", "Veľkosti"]].map(([k, t]) => `<details data-acc-i="${k}"><summary>${t}${ico("chev")}</summary><div class="pacc__bd">${PANELS[k]()}</div></details>`).join("");

  /* ---------- galéria ---------- */
  const gal = $("[data-gal]");
  let cur = 0;
  const mark = i => { cur = i; $$("[data-img]").forEach(b => b.classList.toggle("is-on", +b.dataset.img === cur)); };
  const showImg = i => { i = (i + imgs.length) % imgs.length; gal.scrollTo({ left: i * gal.clientWidth, behavior: "smooth" }); mark(i); };
  gal.addEventListener("scroll", () => { const i = Math.round(gal.scrollLeft / gal.clientWidth); if (i !== cur) mark(i); }, { passive: true });

  /* ---------- výber variantu ---------- */
  const sel = { color: p.colors.length === 1 ? 0 : -1, size: p.sizes.length === 1 ? 0 : -1 };
  const qtyIn = $("[data-qty]");
  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-stage], a[data-rez]"); if (!t) return;
    if (t.dataset.img) showImg(+t.dataset.img);
    else if (t.matches("[data-pfav]")) { const on = toggleFav(p.id); t.classList.toggle("is-on", on); t.setAttribute("aria-pressed", on); toast(on ? "Pridané k obľúbeným" : "Odstránené z obľúbených"); }
    else if (t.matches("[data-stage]")) { const lb = $("[data-lb]"); lb.querySelector("img").src = imgs[cur]; lb.classList.add("is-on"); }
    else if (t.dataset.color) { sel.color = +t.dataset.color; $$("[data-color]").forEach(b => b.classList.toggle("is-on", b === t)); $("[data-color-name]").textContent = p.colors[sel.color].n; t.closest(".opt").classList.remove("is-err"); }
    else if (t.dataset.size) { sel.size = +t.dataset.size; $$("[data-size]").forEach(b => { b.classList.toggle("is-on", b === t); b.setAttribute("aria-pressed", b === t); }); t.closest(".opt").classList.remove("is-err"); }
    else if (t.dataset.logo !== undefined && t.closest(".lgo")) { sel.logo = t.dataset.logo; $$(".lgo button").forEach(b => { b.classList.toggle("is-on", b === t); b.setAttribute("aria-pressed", b === t); }); $("[data-lgo-up]").hidden = !sel.logo; }
    else if (t.dataset.qd) qtyIn.value = Math.max(1, Math.min(99, (+qtyIn.value || 1) + +t.dataset.qd));
    else if (t.dataset.tab) showTab(t.dataset.tab);
    else if (t.dataset.tabgo) {
      const acc = $(`[data-acc-i="${t.dataset.tabgo}"]`);
      if (acc && acc.offsetParent) { acc.open = true; acc.scrollIntoView({ behavior: "smooth", block: "start" }); }
      else { showTab(t.dataset.tabgo); $(".ptabs").scrollIntoView({ behavior: "smooth", block: "start" }); }
    }
    else if (t.matches("a[data-rez]")) {
      const v = [p.sizes[sel.size] && "veľkosť " + p.sizes[sel.size], p.colors[sel.color] && "farba " + p.colors[sel.color].n].filter(Boolean).join(", ");
      t.href = `mailto:${FIRM.mail}?subject=${encodeURIComponent("Rezervácia na vyskúšanie: " + p.name)}&body=${encodeURIComponent(`Dobrý deň,\nchcem si v predajni na ${FIRM.street} vyskúšať produkt ${p.name}${v ? ` (${v})` : ""}.\nKedy si ho môžem prísť pozrieť?\n\n${location.href}`)}`;
    }
    else if (t.matches("[data-add]")) {
      const bad = [["color", p.colors.length], ["size", p.sizes.length]].filter(([k, n]) => n && sel[k] < 0).map(([k]) => k);
      if (bad.length) {
        bad.forEach(k => { const o = $(`[data-opt="${k}"]`); o.classList.remove("is-err"); void o.offsetWidth; o.classList.add("is-err"); });
        $(`[data-opt="${bad[0]}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const lf = $("[data-lgo-file]")?.files[0], ln = $("[data-lgo-note]")?.value.trim();
      addToCart(p.id, p.sizes[sel.size] || "", p.colors[sel.color]?.n || "", Math.max(1, +qtyIn.value || 1), sel.logo || "", sel.logo ? { ...(lf ? { file: lf.name } : {}), ...(ln ? { note: ln } : {}) } : {});
    }
  });
  $("[data-lb]").addEventListener("click", e => e.currentTarget.classList.remove("is-on"));
  qtyIn.addEventListener("change", () => qtyIn.value = Math.max(1, Math.min(99, parseInt(qtyIn.value) || 1)));
  $("[data-lgo-file]")?.addEventListener("change", e => { const f = e.target.files[0]; if (f) $("[data-lgo-fname]").innerHTML = `<b>${esc(f.name)}</b><small>Priložené · klikni pre zmenu</small>`; e.target.closest(".lgo-file").classList.toggle("is-on", !!f); });
  const lq = new URLSearchParams(location.search).get("logo");
  if (lq) $(`.lgo button[data-logo="${lq}"]`)?.click();
  if (location.hash === "#vyber") requestAnimationFrame(() => document.getElementById("vyber")?.scrollIntoView({ block: "center" }));
})();
</script>
<script>DAMI.mountFooter()</script>
</body>
</html>
