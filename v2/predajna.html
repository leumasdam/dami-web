  <section class="wrap pr-pts" aria-label="Prečo prísť osobne" data-pts></section>
</main>

<script>
(() => {
  const { ico, FIRM } = DAMI;
  const $ = s => document.querySelector(s);
  const tel = n => n.replace(/\s/g, "");
  const arrow = ico("arrow");
  const days = { "Po – Pi": "Pondelok – Piatok", "So": "Sobota", "Ne": "Nedeľa" };
  $("[data-info]").innerHTML = `
    <div class="pr-row pr-row--addr">${ico("pin")}<h2>${FIRM.street}, <span>${FIRM.city}</span></h2></div>
    <div class="pr-row">${ico("clock")}<div>
      <table class="pr-hours"><tbody>${FIRM.hours.map(([d, h]) => `<tr><th scope="row">${days[d] || d}</th><td>${h === "Zatvorené" ? "zatvorené" : h}</td></tr>`).join("")}</tbody></table>
      <p class="pr-hours-m">Po–Pi 9:30–17:00 · So 9:00–12:00</p></div></div>
    <div class="pr-row">${ico("phone")}<div class="pr-tel"><a href="tel:${tel(FIRM.phone)}">${FIRM.phone}</a><a href="tel:${tel(FIRM.phone2)}">${FIRM.phone2}</a></div></div>
    <div class="pr-row">${ico("mail")}<a href="mailto:${FIRM.mail}">${FIRM.mail}</a></div>
    <div class="pr-btns"><a class="btn btn--red bx" href="${FIRM.map}" target="_blank" rel="noopener">Navigovať ${arrow}</a><a class="btn btn--redline bx" href="tel:${tel(FIRM.phone)}">${ico("phone")} Zavolať</a></div>`;
  $("[data-map]").href = FIRM.map;

  const I = {
    hanger: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 7.5a2 2 0 1 1 2-2c0 1.3-2 1.6-2 3.5l8.6 6.2a1.1 1.1 0 0 1-.7 2H4.1a1.1 1.1 0 0 1-.7-2L12 9"/></svg>',
  };
  $("[data-pts]").innerHTML = [
    [I.hanger, "Vyskúšate si veľkosť", "Oblečenie, obuv aj doplnky si u nás pohodlne vyskúšate."],
    [ico("chat"), "Poradíme s výberom", "Pomôžeme vám nájsť riešenie presne podľa vašich potrieb."],
    [ico("box"), "Odložíme tovar z e&#8209;shopu", "Objednávku z e&#8209;shopu vám radi pripravíme na vyzdvihnutie v predajni."],
  ].map(([i, h, p], n) => `<div class="pr-pt rv" data-d="${n * 70}">${i}<div><h3>${h}</h3><p>${p}</p></div></div>`).join("");
})();
</script>
<script>
(() => { const st = DAMI.openNow(), el = document.querySelector("[data-live]"); el.textContent = st.text; el.classList.toggle("is-open", st.open);
  document.querySelector("[data-gr]").href = DAMI.REVIEWS.url; })();
</script>
<script>DAMI.mountFooter()</script>
</body>
</html>
