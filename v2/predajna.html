<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predajňa v Piešťanoch – Gaštanová 6396 | DAMI pracovné odevy</title>
<meta name="description" content="Kamenná predajňa DAMI v Piešťanoch: pracovné oblečenie, obuv, gastro a zdravotnícke odevy na vyskúšanie. Gaštanová 6396, Po–Pi 9:30–17:00, So 9:00–12:00.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/dami.css">
<link rel="stylesheet" href="css/dami2.css?v=1121d">
<link rel="stylesheet" href="css/sub.css">
<link rel="stylesheet" href="css/hero.css?v=1121a">
<link rel="stylesheet" href="css/predajna.css">
<link rel="preload" as="image" href="img/predajna-ext-hd.webp">
<script src="../data/catalog.js"></script>
<script src="js/packshots.js"></script>
<script src="js/dami.js?v=1121c"></script>
<script src="js/xmas.js?v=1121g" defer></script>
</head>
<body>
<script>DAMI.mount("light", "predajna")</script>

<main>
  <div data-hero></div>

  <section class="wrap pr-vis" id="kontakt" aria-label="Kontakt a mapa">
    <div class="pr-card" data-info></div>
    <div class="pr-gmap">
      <iframe title="Mapa: DAMI pracovné odevy, Gaštanová 6396, Piešťany" src="https://www.google.com/maps?q=Ga%C5%A1tanov%C3%A1+6396,+921+01+Pie%C5%A1%C5%A5any&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <a class="pr-gmap__link" data-map target="_blank" rel="noopener">Otvoriť v Google Mapách <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
    </div>
  </section>

  <section class="wrap sub-sec pr-in">
    <h2 class="h2x">V predajni nájdete</h2>
    <div class="pr-ph">
      <figure class="photo"><img src="../assets/img/predajna-obuv.webp" alt="Regály s pracovnou a bezpečnostnou obuvou a policami oblečenia v predajni DAMI" width="680" height="510" loading="lazy"></figure>
      <figure class="photo"><img src="../assets/img/predajna-odevy.webp" alt="Vešiaky s pracovnými bundami, nohavicami a reflexnými odevmi v predajni DAMI" width="680" height="510" loading="lazy"></figure>
      <figure class="photo"><img src="../assets/img/predajna-pult.webp" alt="Pult predajne DAMI, police s tričkami a obuvou" width="680" height="510" loading="lazy"></figure>
    </div>
  </section>

  <section class="wrap pr-pts" aria-label="Prečo prísť osobne" data-pts></section>
</main>

<script>
(() => {
  const { ico, FIRM } = DAMI;
  const $ = s => document.querySelector(s);
  const tel = n => n.replace(/\s/g, "");
  const arrow = ico("arrow");
  const days = { "Po – Pi": "Pondelok – Piatok", "So": "Sobota", "Ne": "Nedeľa" };
  $("[data-info]").innerHTML = `
    <h2>Kontakt</h2>
    <dl class="pr-dl">
      <dt>Adresa</dt><dd>${FIRM.street}<br>${FIRM.city}</dd>
      <dt>Otvorené</dt><dd><table class="pr-hours"><tbody>${FIRM.hours.map(([d, h]) => `<tr><th scope="row">${days[d] || d}</th><td>${h === "Zatvorené" ? "zatvorené" : h}</td></tr>`).join("")}</tbody></table></dd>
      <dt>Telefón</dt><dd class="pr-tel"><a href="tel:${tel(FIRM.phone)}">${FIRM.phone}</a><a href="tel:${tel(FIRM.phone2)}">${FIRM.phone2}</a></dd>
      <dt>E-mail</dt><dd><a href="mailto:${FIRM.mail}">${FIRM.mail}</a></dd>
    </dl>
    <div class="pr-btns"><a class="btn btn--red" href="${FIRM.map}" target="_blank" rel="noopener">Navigovať ${arrow}</a><a class="btn btn--redline" href="tel:${tel(FIRM.phone)}">${ico("phone")} Zavolať</a></div>`;
  $("[data-map]").href = FIRM.map;

  const I = {
    hanger: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 7.5a2 2 0 1 1 2-2c0 1.3-2 1.6-2 3.5l8.6 6.2a1.1 1.1 0 0 1-.7 2H4.1a1.1 1.1 0 0 1-.7-2L12 9"/></svg>',
  };
  $("[data-pts]").innerHTML = [
    [I.hanger, "Vyskúšate si veľkosť", "Oblečenie, obuv aj doplnky si u nás pohodlne vyskúšate."],
    [ico("chat"), "Poradíme s výberom", "Pomôžeme vám nájsť riešenie presne podľa vašich potrieb."],
    [ico("box"), "Odložíme tovar z e&#8209;shopu", "Objednávku z e&#8209;shopu vám radi pripravíme na vyzdvihnutie v predajni."],
  ].map(([i, h, p], n) => `<div class="pr-pt rv" data-d="${n * 70}">${i}<div><h3>${h}</h3><p>${p}</p></div></div>`).join("");
})();
</script>
<script>
(() => {
  const { FIRM, REVIEWS, openNow, heroB } = DAMI;
  const st = openNow(), tel = FIRM.phone.replace(/\s/g, "");
  document.querySelector("[data-hero]").outerHTML = heroB({
    crumbs: [["index.html", "Domov"], ["", "Predajňa"]], eye: "Predajňa Piešťany",
    h1: "Príďte si to vyskúšať.",
    extra: `<p class="hv-b__live${st.open ? " is-open" : ""}">${st.text}</p>
      <dl class="hv-b__facts"><dt>Adresa</dt><dd>${FIRM.street}, Piešťany</dd><dt>Otvorené</dt><dd>Po–Pi 9:30–17:00 · So 9:00–12:00</dd><dt>Telefón</dt><dd><a href="tel:${tel}">${FIRM.phone}</a></dd></dl>`,
    btns: [[FIRM.map, "Navigovať"], ["tel:" + tel, "Zavolať", "ghost"]],
    trust: [`<a href="${REVIEWS.url}" target="_blank" rel="noopener">★ 4,7 · 42 hodnotení na Google</a>`, "Odložíme ti tovar z e-shopu", "Osobný odber zadarmo"],
    photo: "img/predajna-ext-hd.webp", pos: "50% 60%", alt: "Predajňa DAMI pracovné odevy a obuv na Gaštanovej 6396 v Piešťanoch" });
})();
</script>
<script>DAMI.mountFooter()</script>
</body>
</html>
