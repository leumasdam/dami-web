<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Košík a objednávka | DAMI pracovné odevy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/dami.css">
<link rel="stylesheet" href="css/dami2.css?v=1121x">
<link rel="stylesheet" href="css/sub.css">
<link rel="stylesheet" href="css/kosik.css">
<script src="../data/catalog.js"></script>
<script src="js/dami.js?v=1121x"></script>
<script src="js/track.js?v=1121a"></script>
<script src="js/xmas.js?v=1121z" defer></script>
</head>
<body class="ck ck-s1">
<script>DAMI.mount("light", "")</script>

<!-- pokladničná hlavička: logo + 3 kroky (desktop) -->
<div class="khd">
  <div class="wrap khd__in">
    <a class="hdr__logo khd__logo" href="index.html" aria-label="DAMI pracovné odevy – domov" data-logo></a>
    <ol class="ksteps" data-steps aria-label="Kroky objednávky"></ol>
  </div>
</div>

<main class="wrap kpage">
  <h1 class="ktitle" data-title>Košík</h1>
  <div class="kmain" data-main></div>
</main>
<div class="kbar" data-bar></div>

<script>
(() => {
  const { P, ico, eur, esc, cart, cartTotal, cartCount, prodUrl, FIRM, store, FREE, catUrl, LOGO } = DAMI;
  const $ = s => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const svg = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const I = {
    trash: svg('<path d="M4 7h16M9.5 7V4.5h5V7M6.2 7l.9 13h9.8l.9-13M10 11v5.5M14 11v5.5"/>'),
    card: svg('<rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 14.5h4.5"/>'),
    bank: svg('<path d="M3 9.2 12 4l9 5.2M4 20h16M3 22h18M6 10.5v7M10 10.5v7M14 10.5v7M18 10.5v7"/>'),
    hand: svg('<path d="M2.5 14h3.2l3.6 2.4h4.6a1.5 1.5 0 0 0 0-3h-3.2M5.7 20.5h8.6l6.6-4.6a1.6 1.6 0 0 0-1.9-2.6l-4 2.5"/><rect x="9.5" y="3.5" width="8.5" height="7" rx="1"/><path d="M12.6 3.5v2.6h2.3V3.5"/>'),
    doc: svg('<path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14.5 3v4.5H19M9 11.5h7M9 15h7M9 8h2.5"/>'),
    truck: svg('<path d="M8 7.5h8v8.5H8zM16 10.5h3.2l2.3 2.8v2.7H16"/><circle cx="10.5" cy="17.5" r="1.7"/><circle cx="18.5" cy="17.5" r="1.7"/><path d="M2 9.5h4M3 12.5h3M4 15.5h2"/>'),
  };
  const arrow = ico("arrow");
  const tel = FIRM.phone.replace(/\s/g, "");
  $("[data-logo]").innerHTML = LOGO();

  /* demo: ?demo=1 naplní košík ako v návrhu */
  if (qs.has("demo")) {
    const demo = [["chefline-rondon-kratky-rukav-cierny-cvoky", "50", 2], ["kucharske-nohavice-plutone-giblors", "L", 2], ["slapky-ardon-rjuno-white", "39", 1]]
      .filter(([id]) => P[id]).map(([id, size, qty]) => ({ id, size, color: P[id].colors[0]?.n || "", qty }));
    store.set("dami-cart", demo);
    store.set("dami-order2", {});
    history.replaceState(null, "", location.pathname);
    DAMI.syncBadges();
  }

  /* stav objednávky: krok 1 = košík + doprava + platba, 2 = údaje, 3 = potvrdenie */
  const st = Object.assign({ step: 1, ship: "odber", pay: "karta", c: {} }, store.get("dami-order2", {}));
  st.step = 1;
  const save = () => store.set("dami-order2", { ship: st.ship, pay: st.pay, c: st.c });
  const SHIP = {
    odber: { ico: ico("store"), d: "Osobný odber v predajni Piešťany", m: "Osobný odber v Piešťanoch", s: `${FIRM.street}, Piešťany`, price: 0 },
    packeta: { ico: ico("box"), d: "Packeta výdajné miesto", m: "Packeta", s: "Výdajné miesto alebo box, 2–3 pracovné dni", price: 2.9 },
    kurier: { ico: I.truck, d: "Kuriér na adresu", m: "Kuriér", s: "Doručenie na vašu adresu, 2–3 pracovné dni", price: 3.9 },
  };
  const PAY = {
    karta: { ico: I.card, t: "Kartou online", s: "Zaplatíte hneď pri dokončení objednávky." },
    prevod: { ico: I.bank, t: "Bankový prevod", s: "Platobné údaje vám pošleme e-mailom." },
    prevzatie: { ico: I.hand, t: "Pri prevzatí" },
  };
  if (!SHIP[st.ship]) st.ship = "odber";
  if (!PAY[st.pay]) st.pay = "karta";
  const shipPrice = k => (k !== "odber" && cartTotal() >= FREE) ? 0 : SHIP[k].price;
  const payPrice = k => (k === "prevzatie" && st.ship !== "odber") ? 1.5 : 0;
  const total = () => cartTotal() + shipPrice(st.ship) + payPrice(st.pay);
  const STEPS = ["Košík", "Doprava a platba", "Údaje"];
  let atShip = false;

  function steps() {
    const on = st.step === 1 ? (atShip ? 2 : 1) : st.step === 2 ? 3 : 4;
    $("[data-steps]").innerHTML = STEPS.map((s, i) => {
      const n = i + 1, cls = n === on ? "is-on" : n < on ? "is-done" : "";
      return `<li class="${cls}" ${n === on ? 'aria-current="step"' : ""}>${st.step < 3 ? `<button type="button" data-step="${n}"><span class="ksteps__n">${n}</span><span class="ksteps__t">${s}</span></button>` : `<span class="ksteps__n">${n}</span><span class="ksteps__t">${s}</span>`}</li>`;
    }).join("");
  }

  function shipOpts() {
    return `<div class="kopts" role="radiogroup" aria-label="Spôsob doručenia">${Object.entries(SHIP).map(([k, s]) => `
      <label class="kopt"><input type="radio" name="ship" value="${k}" ${st.ship === k ? "checked" : ""}>
        <span class="kopt__ico">${s.ico}</span>
        <span class="kopt__t"><b><span class="d">${s.d}</span><span class="m">${s.m}</span>${k === "odber" ? " <em>· zadarmo</em>" : ""}</b><small>${s.s}${k === "odber" ? "" : ` · <span class="${shipPrice(k) ? "" : "kopt__free"}">${shipPrice(k) ? eur(shipPrice(k)) : "zadarmo"}</span>`}</small></span>
        <i class="kopt__r" aria-hidden="true"></i></label>`).join("")}</div>
      ${cartTotal() < FREE ? `<p class="knote">Pri nákupe nad ${eur(FREE)} je doprava Packetou aj kuriérom zadarmo. Chýba vám ${eur(FREE - cartTotal())}.</p>` : ""}`;
  }
  function payOpts() {
    return `<div class="kopts" role="radiogroup" aria-label="Spôsob platby">${Object.entries(PAY).map(([k, p]) => {
      const s = k === "prevzatie" ? (st.ship === "odber" ? "Hotovosť alebo karta priamo v predajni." : "Dobierka – zaplatíte kuriérovi pri prevzatí.") : p.s;
      const pp = payPrice(k);
      return `<label class="kopt"><input type="radio" name="pay" value="${k}" ${st.pay === k ? "checked" : ""}>
        <span class="kopt__ico">${p.ico}</span>
        <span class="kopt__t"><b>${p.t}${pp ? ` <span class="kopt__pr">· +${eur(pp)}</span>` : ""}</b><small>${s}</small></span>
        <i class="kopt__r" aria-hidden="true"></i></label>`; }).join("")}</div>`;
  }

  function items() {
    return cart().map((l, i) => { const p = P[l.id]; return `<article class="kit">
      <a class="kit__img" href="${prodUrl(p.id)}" tabindex="-1"><img src="${p.img[0]}" alt="${esc(p.name)}"></a>
      <div class="kit__txt"><a class="kit__name" href="${prodUrl(p.id)}">${esc(p.name)}</a>
        <span class="kit__var">${l.size ? `Veľkosť: ${esc(l.size)}` : ""}${l.size && l.color ? " · " : ""}${l.color ? `Farba: ${esc(l.color)}` : ""}</span></div>
      <div class="kqty"><button type="button" data-q="${i}" data-d="-1" aria-label="Menej kusov">−</button><span><b>${l.qty}</b><i> ks</i></span><button type="button" data-q="${i}" data-d="1" aria-label="Viac kusov">+</button></div>
      <b class="kit__price">${eur(p.price * l.qty)}</b>
      <button type="button" class="kit__rm" data-q="${i}" data-d="rm" aria-label="Odstrániť ${esc(p.name)}">${I.trash}</button>
    </article>`; }).join("");
  }

  function summary() {
    const sp = shipPrice(st.ship), pp = payPrice(st.pay), t = total();
    const s1 = st.step === 1;
    return `<aside class="ksum" aria-label="Súhrn objednávky">
      ${s1 ? "" : `<div class="kmini">${cart().map(l => `<div><img src="${P[l.id].img[0]}" alt=""><span>${l.qty}× ${esc(P[l.id].name)}${l.size ? ` <small>· ${esc(l.size)}</small>` : ""}</span><b>${eur(P[l.id].price * l.qty)}</b></div>`).join("")}</div>`}
      <div class="ksum__rows">
        <div><span>Medzisúčet</span><span>${eur(cartTotal())}</span></div>
        <div><span>Doprava</span><span>${eur(sp)}</span></div>
        ${pp ? `<div><span>Dobierka</span><span>${eur(pp)}</span></div>` : ""}
      </div>
      <div class="ksum__tot"><div><b>Spolu</b><small>vrátane DPH</small></div><strong>${eur(t)}</strong></div>
      ${s1 ? `<form class="kcode" data-code><span class="kcode__ico">${ico("tag")}</span><input placeholder="Zľavový kód" aria-label="Zľavový kód"><button>Použiť</button></form><p class="kcode__msg" data-code-msg role="alert"></p>` : ""}
      <button type="button" class="btn btn--red kgo" data-next>${s1 ? "Pokračovať" : "Odoslať objednávku"} ${arrow}</button>
      ${s1 ? `<button type="button" class="kfirm" data-firm-go>${I.doc}<span>Firma? Zadajte IČO a vystavíme faktúru.</span></button>`
        : `<p class="klegal">Odoslaním súhlasíte s obchodnými podmienkami a spracovaním osobných údajov.</p><button type="button" class="kback" data-step="1">${ico("chevL")} Späť do košíka</button>`}
    </aside>`;
  }

  function stepCart() {
    return `<div class="kleft">
      <section class="kitems" aria-label="Produkty v košíku">${items()}</section>
      <section class="ksec" id="doprava" data-ship><h2 class="h2m"><span class="d">Doprava</span><span class="m">Spôsob doručenia</span></h2>${shipOpts()}</section>
      <section class="ksec" id="platba" data-pay><h2 class="h2m">Platba</h2>${payOpts()}</section>
    </div>${summary()}`;
  }

  function stepContact() {
    const c = st.c, f = (n, l, t = "text", req = true, cls = "", ac = "") => `<div class="ff ${cls}" ${["firma", "ico", "dic"].includes(n) ? "data-firm" : ""}><label for="k-${n}">${l}${req ? " <i>*</i>" : ""}</label><input id="k-${n}" name="${n}" type="${t}" value="${esc(c[n] || "")}" ${req ? "required" : ""} ${ac ? `autocomplete="${ac}"` : ""}><small>Vyplňte toto pole.</small></div>`;
    const addr = st.ship !== "odber";
    return `<div class="kleft">
      <section class="ksec ksec--first" aria-label="Kontaktné údaje">
      <form class="kform ${c.isFirm ? "is-firm" : ""}" data-contact novalidate>
        ${f("meno", "Meno a priezvisko", "text", true, "", "name")}${f("tel", "Telefón", "tel", true, "", "tel")}${f("email", "E-mail", "email", true, "full", "email")}
        ${addr ? f("ulica", "Ulica a číslo", "text", true, "full", "street-address") + f("mesto", "Mesto", "text", true, "", "address-level2") + f("psc", "PSČ", "text", true, "", "postal-code") : ""}
        <label class="kchk full"><input type="checkbox" name="isFirm" ${c.isFirm ? "checked" : ""}> Nakupujem na firmu – chcem faktúru na IČO</label>
        ${f("firma", "Názov firmy", "text", false, "full")}${f("ico", "IČO", "text", false)}${f("dic", "DIČ / IČ DPH", "text", false)}
        <div class="ff full"><label for="k-pozn">Poznámka k objednávke</label><textarea id="k-pozn" name="pozn">${esc(c.pozn || "")}</textarea></div>
      </form></section>
      <section class="ksec"><h2 class="h2m">Doprava a platba</h2>
        <div class="krecap"><div><span class="kopt__ico">${SHIP[st.ship].ico}</span><b>${SHIP[st.ship].d}</b><span>${shipPrice(st.ship) ? eur(shipPrice(st.ship)) : "zadarmo"}</span></div>
          <div><span class="kopt__ico">${PAY[st.pay].ico}</span><b>${PAY[st.pay].t}</b><span>${payPrice(st.pay) ? eur(payPrice(st.pay)) : ""}</span></div>
          <button type="button" class="ulink" data-step="2">Zmeniť</button></div></section>
    </div>${summary()}`;
  }

  function stepDone() {
    return `<section class="kdone">${ico("checkC")}<span class="label">Objednávka prijatá</span>
      <h2 class="h2x">Ďakujeme za objednávku!</h2>
      <div class="kdone__no">Číslo objednávky: <b>${st.no || ""}</b></div>
      <p>${st.ship === "odber" ? `Keď bude objednávka pripravená na odber v predajni (${FIRM.street}, Piešťany), ozveme sa vám.` : "Potvrdenie pošleme na váš e-mail a o odoslaní vás budeme informovať."} Otázky? Volajte <a href="tel:${tel}"><b>${FIRM.phone}</b></a>.</p>
      <p class="kdone__note">Toto je prototyp nového e-shopu – objednávka sa v skutočnosti neodoslala.</p>
      <a class="btn btn--red bx" href="index.html">Späť na hlavnú stránku ${arrow}</a></section>`;
  }

  function empty() {
    return `<div class="kempty">${ico("cart")}<h2 class="h2m">Váš košík je prázdny</h2><p>Vyberte si z gastro, zdravotníckeho alebo pracovného oblečenia a obuvi. Alebo nás navštívte v predajni v Piešťanoch.</p>
      <div class="kempty__cta"><a class="btn btn--red" href="${catUrl("gastro")}">Gastro a biele odevy ${arrow}</a><a class="btn btn--line" href="${catUrl("pracovne")}">Pracovné odevy</a><a class="btn btn--line" href="zdravotnictvo.html">Zdravotníctvo</a></div></div>`;
  }

  /* spodná lišta na mobile: najprv dovedie k platbe, potom k údajom */
  let payVisible = false;
  function bar() {
    const b = $("[data-bar]");
    if (st.step === 3 || !cart().length) { b.innerHTML = ""; document.body.classList.remove("has-bar"); return; }
    document.body.classList.add("has-bar");
    const lbl = st.step === 2 ? "Odoslať objednávku" : payVisible ? "Pokračovať k údajom" : "Pokračovať k platbe";
    b.innerHTML = `<button type="button" class="btn btn--red bx" data-next data-bar-btn>${lbl} ${arrow}</button>`;
  }

  let io;
  function watch() {
    io?.disconnect();
    const ship = $("[data-ship]"), pay = $("[data-pay]");
    if (!ship || !("IntersectionObserver" in window)) return;
    io = new IntersectionObserver(es => es.forEach(e => {
      if (e.target === ship) { const v = e.isIntersecting || e.boundingClientRect.top < 0; if (v !== atShip) { atShip = v; steps(); } }
      if (e.target === pay) { const v = e.isIntersecting || e.boundingClientRect.top < 0; if (v !== payVisible) { payVisible = v; bar(); } }
    }), { rootMargin: "0px 0px -45% 0px" });
    io.observe(ship); io.observe(pay);
  }

  function render() {
    const m = $("[data-main]"), t = $("[data-title]");
    document.body.classList.toggle("ck-s1", st.step === 1);
    if (st.step < 3 && !cart().length) { st.step = 1; atShip = false; steps(); t.textContent = "Košík"; m.innerHTML = empty(); bar(); return; }
    t.hidden = st.step === 3;
    t.innerHTML = st.step === 1 ? `Košík<span class="m"> (${cart().length})</span>` : "Kontaktné údaje";
    m.className = "kmain" + (st.step === 3 ? " kmain--done" : "");
    m.innerHTML = [, stepCart, stepContact, stepDone][st.step]();
    steps(); bar(); if (st.step === 1) watch();
  }
  function go(n, anchor) {
    st.step = n; atShip = false; payVisible = false; render();
    const el = anchor && document.getElementById(anchor);
    if (el) { const y = el.getBoundingClientRect().top + scrollY - 90; scrollTo({ top: y, behavior: "smooth" }); }
    else scrollTo({ top: 0, behavior: "smooth" });
  }

  function validContact() {
    const form = $("[data-contact]"); let first;
    form.querySelectorAll("[required]").forEach(i => {
      const v = i.value.trim();
      const ok = i.type === "email" ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) : i.type === "tel" ? v.replace(/\D/g, "").length >= 9 : i.name === "psc" ? /^\d{3}\s?\d{2}$/.test(v) : v.length > 1;
      i.closest(".ff").classList.toggle("is-err", !ok); if (!ok && !first) first = i;
    });
    if (first) first.focus();
    return !first;
  }
  function readContact() {
    const form = $("[data-contact]"); if (!form) return;
    const d = Object.fromEntries(new FormData(form)); d.isFirm = !!d.isFirm; st.c = d; save();
  }

  document.addEventListener("click", e => {
    const s = e.target.closest("[data-step]");
    if (s) {
      readContact(); const n = +s.dataset.step;
      if (n === 1) return go(1);
      if (n === 2) return go(1, "doprava");
      if (n === 3 && st.step === 1) return go(2);
      return;
    }
    if (e.target.closest("[data-firm-go]")) { st.c = Object.assign({}, st.c, { isFirm: true }); save(); return go(2); }
    if (!e.target.closest("[data-next]")) return;
    if (st.step === 1 && e.target.closest("[data-bar-btn]") && !payVisible) { const p = $("#platba"); if (p) scrollTo({ top: p.getBoundingClientRect().top + scrollY - 80, behavior: "smooth" }); return; }
    if (st.step === 2) {
      readContact(); if (!validContact()) return;
      st.no = "DM" + new Date().toISOString().slice(2, 10).replace(/-/g, "") + String(Math.floor(Math.random() * 900 + 100));
      store.set("dami-cart", []); DAMI.syncBadges();
    }
    go(st.step + 1);
  });
  document.addEventListener("change", e => {
    if (e.target.name === "ship") { st.ship = e.target.value; save(); const y = scrollY; render(); scrollTo(0, y); }
    if (e.target.name === "pay") { st.pay = e.target.value; save(); const y = scrollY; render(); scrollTo(0, y); }
    if (e.target.name === "isFirm") e.target.closest("form").classList.toggle("is-firm", e.target.checked);
  });
  document.addEventListener("submit", e => {
    if (!e.target.matches("[data-code]")) return;
    e.preventDefault(); const v = e.target.querySelector("input").value.trim(), m = $("[data-code-msg]");
    m.textContent = v ? `Kód „${v}“ nie je platný alebo mu vypršala platnosť.` : "Zadajte zľavový kód."; m.classList.add("is-on");
  });
  document.addEventListener("dami:cart", () => { if (st.step < 3) { const y = scrollY; render(); scrollTo(0, y); } });
  render();
})();
</script>
<script>DAMI.mountFooter()</script>
</body>
</html>
