<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kategória | DAMI pracovné odevy</title>
<meta name="description" content="Pracovné oblečenie, gastro a zdravotnícke odevy, obuv a doplnky. Online aj v našej predajni v Piešťanoch.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/dami.css">
<link rel="stylesheet" href="css/dami2.css">
<link rel="stylesheet" href="css/kategoria.css">
<script src="../data/catalog.js"></script>
<script src="js/dami.js"></script>
</head>
<body class="pg-kat">
<script>
  window.CAT = (() => {
    const { D, qp, sectionOf } = DAMI;
    const c = qp("c") || "all";
    const isSec = !!D.sections[c] || Object.values(D.sections).some(s => s.root === c);
    const sec = D.sections[c] ? c : sectionOf(c) || "";
    return { c, sec, isSec: isSec || !D.cats[c] };
  })();
  DAMI.mount("dark", CAT.sec);
</script>

<main>
  <section class="wrap khd" data-hero></section>
  <nav class="wrap ksub" aria-label="Podkategórie" data-subs></nav>
  <div class="wrap ktiles" data-tiles></div>
  <div class="sheet-bg" data-sheet-close></div>
  <div class="wrap cat">
    <aside class="side" aria-label="Filtre" data-side></aside>
    <div class="main">
      <div class="bar">
        <button class="kbtn fbtn" data-sheet-open></button>
        <label class="sort kbtn">
          <svg class="ico sort__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M4.5 7.5 8 4l3.5 3.5M16 20V4M12.5 16.5 16 20l3.5-3.5"/></svg>
          <span class="sort__lab">Zoradiť<span class="sort__colon">:</span></span>
          <select data-sort aria-label="Zoradiť produkty">
            <option value="pop">Odporúčané</option><option value="asc">Najlacnejšie</option><option value="desc">Najdrahšie</option><option value="name">Názov A – Z</option>
          </select>
        </label>
        <span class="bar__n" data-count></span>
      </div>
      <div class="chips" data-chips></div>
      <div class="pgrid kgrid" data-grid></div>
      <nav class="pager" aria-label="Stránkovanie" data-pager></nav>
    </div>
  </div>
  <div class="wrap"><a class="kstrip" href="predajna.html">
    <img class="kstrip__hand" src="img/hand-red.png" alt="" width="458" height="600" loading="lazy">
    <p class="kstrip__t">Nevieš veľkosť? Vyskúšaj <span class="mk">v predajni.</span></p>
    <span class="kstrip__go" data-strip-ico></span>
  </a></div>
</main>

<script>
(() => {
  const { D, P, ico, card, esc, qp, catUrl, secProducts, catProducts, favs, search, FIRM } = DAMI;
  const $ = s => document.querySelector(s);
  const { c, sec, isSec } = CAT;
  const q = qp("q") || "";
  const FUNNEL = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h17l-6.5 8v6l-4 2v-8z"/></svg>';

  /* ---------- konfigurácia sekcií ---------- */
  const SEC = {
    gastro: { h: "Gastro a biele odevy", tail: "pre kuchyne, reštaurácie a cukrárne", img: "img/foto-gastro.webp", pos: "50% 42%",
      tiles: [["rondony-a-bluze", "Rondony<br>a blúzy", "../assets/img/gastro-kuchar-ciapka.webp", "70% 30%"], ["kucharske-nohavice", "Nohavice", "../assets/img/biele-odevy.webp", "60% 50%"], ["zastery-a-plaste", "Zástery", "../assets/img/zastery.webp", "60% 40%"], ["kucharska-obuv", "Obuv", "../assets/img/gastro-obuv.webp", "60% 60%"]] },
    zdravotnictvo: { h: "Zdravotníctvo a wellness", tail: "pre ambulancie, nemocnice aj wellness", img: "img/cat-zdrav.webp", pos: "50% 24%",
      tiles: [["zdrav-bluzy", "Blúzy<br>a tuniky", "../assets/gen/zdrav-tile-bluzy.webp", "70% 30%"], ["zdrav-nohavice", "Nohavice", "../assets/gen/zdrav-tile-nohavice.webp", "70% 45%"], ["zdrav-obuv", "Obuv", "../assets/gen/zdrav-tile-obuv.webp", "70% 60%"]] },
    pracovne: { h: "Pracovné odevy", tail: "na stavbu, do dielne, skladu aj von", img: "img/ban-pracovne.webp", pos: "100% 45%",
      tiles: [["bundy", "Bundy<br>a blúzy", "../assets/img/pracovne-odevy.webp", "65% 30%"], ["reflexne-odevy", "Reflexné<br>odevy", "../assets/gen/firmy-stavebnictvo.webp", "65% 30%"], ["nohavice", "Nohavice", "../assets/gen/firmy-priemysel.webp", "60% 40%"], ["tricka-kosele-polokosele", "Tričká<br>a polokošele", "../assets/img/firmy-polokosela.webp", "55% 30%"]] },
    obuv: { h: "Pracovná a bezpečnostná obuv", tail: "– bezpečnostná S1 až S3, pracovná O1 a O2 aj gumáky", img: "img/ban-obuv.webp", pos: "100% 55%",
      tiles: [["s1-s1p-s3-ocelovou-vystuzou", "S1 – S3", "../assets/img/obuv-bezpecnostna.webp", "60% 55%"], ["o1-o2-bez-ocelovej-spice", "O1, O2", "../assets/img/predajna-obuv.webp", "50% 50%"], ["kucharska-obuv", "Gastro<br>obuv", "../assets/img/gastro-obuv.webp", "60% 60%"], ["doplnky-k-obuvi", "Doplnky", "../assets/gen/cat-doplnky.webp", "80% 50%"]] },
    doplnky: { h: "Doplnky a ochranné pomôcky", tail: "– rukavice, ochranné pomôcky, opasky a traky", img: "img/cat-doplnky.webp", pos: "50% 62%",
      tiles: [["rukavice", "Rukavice", "../assets/gen/cat-rukavice.webp", "75% 50%"], ["ochranne-pomocky", "Ochranné<br>pomôcky", "../assets/gen/cat-ochranne.webp", "70% 55%"], ["doplnky", "Opasky<br>a traky", "../assets/gen/cat-doplnky.webp", "75% 50%"]] },
  };
  const CAT_IMG = { rukavice: ["img/cat-doplnky.webp", "50% 62%"], "ochranne-pomocky": ["../assets/gen/cat-ochranne.webp", "70% 55%"], "kucharska-obuv": ["img/ban-obuv.webp", "100% 55%"], "zdrav-obuv": ["img/ban-obuv.webp", "100% 55%"] };
  const SEC_TILES = [["gastro", "Gastro", "../assets/img/gastro-kuchar.webp", "70% 30%"], ["@zdravotnictvo.html", "Zdravotníctvo", "../assets/img/zdravotnictvo.webp", "70% 25%"], ["pracovne", "Pracovné<br>odevy", "../assets/img/pracovne-odevy.webp", "68% 30%"], ["obuv", "Obuv", "../assets/img/obuv-bezpecnostna.webp", "70% 55%"], ["doplnky", "Doplnky", "../assets/gen/cat-rukavice.webp", "75% 50%"]];
  const plural = n => n === 1 ? "produkt" : n >= 2 && n <= 4 ? "produkty" : "produktov";

  /* ---------- zdroj produktov ---------- */
  let base, title, tail = "", crumbs = [["index.html", "Domov"]];
  const S = SEC[sec];
  if (c === "oblubene") { base = favs().map(id => P[id]).filter(Boolean); title = "Obľúbené produkty"; tail = "uložených v tvojom prehliadači"; }
  else if (c === "all" || (!S && !D.cats[c])) { base = D.products; title = q ? `Výsledky pre „${q}“` : "Všetky produkty"; tail = q ? "" : "– gastro, zdravotníctvo, pracovné odevy, obuv aj doplnky"; }
  else if (isSec) { base = secProducts(sec); title = S.h; tail = S.tail; }
  else { base = secProducts(sec); title = D.cats[c].name; tail = `z kategórie ${D.sections[sec].name.toLowerCase()}`; }
  if (sec) crumbs.push([sec === "zdravotnictvo" ? "zdravotnictvo.html" : catUrl(sec), D.sections[sec].name]);
  if (!isSec && D.cats[c]) crumbs.push(["", D.cats[c].name]);
  if (q) base = search(q).filter(p => base.includes(p));
  if (c === "all") crumbs.push(["", q ? "Vyhľadávanie" : "Všetky produkty"]);
  if (c === "oblubene") crumbs.push(["", "Obľúbené"]);
  document.title = `${title} | DAMI pracovné odevy`;

  /* ---------- hlavička kategórie: banner s konkrétnou ponukou (ceny z katalógu) ---------- */
  const PROMO = {
    gastro: { img: "img/hero/kat-gastro.webp", t: "red", k: "CHEFLINE · čierny, krátky rukáv", h: "Rondon, ktorý zvládne celú zmenu. Za 19,90 €", sub: "Rondony od 18,50 € · biele aj čierne", href: DAMI.prodUrl("chefline-rondon-kratky-rukav-cierny-cvoky"), cta: "Pozrieť rondon" },
    pracovne: { img: "img/hero/kat-pracovne.webp", t: "dark", k: "Zima na stavbe aj v dielni", h: "Zimné bundy od 27,90 €", sub: "17 modelov · bunda CARSON predtým 36,00 €", href: catUrl("zimne-bundy"), cta: "Zimné bundy" },
    obuv: { img: "img/hero/kat-obuv.webp", t: "light", bg: "#ECE8E2", k: "CXS EVO ICON S3S", h: "Bezpečnostná obuv S3 od 39,90 €", sub: "Kompozitná špica, bez kovových súčastí", href: catUrl("s1-s1p-s3-ocelovou-vystuzou"), cta: "Obuv S1–S3" },
    doplnky: { img: "img/hero/kat-doplnky.webp", t: "light", bg: "#EFE6D8", k: "CXS ROXY WINTER", h: "Zimné rukavice od 1,80 €", sub: "Máčané v latexe aj nitrile · rukavice od 0,40 €", href: catUrl("rukavice"), cta: "Rukavice" },
    zdravotnictvo: { img: "img/hero/kat-zdrav.webp", t: "light", bg: "#F3DFE4", k: "CESARE", h: "Set blúza + nohavice za 29,80 €", sub: "Biela, mätová, bordó, svetlomodrá", href: DAMI.prodUrl("cesare-zdrav-noh-belasa"), cta: "Vybrať farbu" },
  };
  const PR = c === "oblubene" ? null : PROMO[sec];
  const [heroImg, heroPos] = (!isSec && CAT_IMG[c]) || (S ? [S.img, S.pos] : ["img/foto-tim.webp", "50% 38%"]);
  const words = esc(title).split(" ");
  const h1 = words.length > 1 ? `${words.slice(0, -1).join(" ")} <span class="mk">${words.at(-1)}</span>` : `<span class="mk">${words[0]}</span>`;
  const baseN = isSec || !D.cats[c] ? base.length : base.filter(p => p.cats.includes(c)).length;
  $("[data-hero]").innerHTML = `<div class="khd__txt">
      <nav class="crumbs" aria-label="Omrvinky">${crumbs.map(([h, t], i) => i === crumbs.length - 1 ? `<b>${esc(t)}</b>` : `<a href="${h}">${esc(t)}</a><span>/</span>`).join("")}</nav>
      <h1 class="${title.length > 22 ? "is-long" : ""}">${h1}</h1>
      <p class="khd__n"><b>${baseN} ${plural(baseN)}</b><span> ${esc(tail)}</span></p>
    </div>
    ${PR ? `<a class="khd__img kpro kpro--${PR.t}" href="${PR.href}" style="--kbg:${PR.bg || (PR.t === "red" ? "#D9180F" : "#111")}"><img src="${PR.img}" alt="" fetchpriority="high">
      <span class="kpro__txt"><span class="kpro__k">${PR.k}</span><b class="kpro__h">${PR.h}</b><span class="kpro__sub">${PR.sub}</span><span class="btn ${PR.t === "light" ? "btn--red" : "btn--white"} btn--sm">${PR.cta} ${ico("arrow")}</span></span></a>`
      : `<div class="khd__img"><img src="${heroImg}" alt="" style="object-position:${heroPos}" fetchpriority="high"></div>`}`;

  /* ---------- podkategórie (pilulky) + mobilné dlaždice ---------- */
  const subs = sec ? D.sections[sec].subs.filter(k => D.cats[k] && base.some(p => p.cats.includes(k))) : [];
  const subHref = k => sec === "doplnky" && k === "doplnky" ? catUrl("doplnky") + "&k=doplnky" : catUrl(k);
  const pills = sec ? subs.map(k => [subHref(k), D.cats[k].name, !isSec && k === c])
    : Object.entries(D.sections).map(([k, s]) => [k === "zdravotnictvo" ? "zdravotnictvo.html" : catUrl(k), s.name, false]);
  $("[data-subs]").innerHTML = c === "oblubene" ? "" : pills.map(([h, t, on]) => `<a class="ksub__a ${on ? "is-on" : ""}" href="${h}" ${on ? 'aria-current="page"' : ""}>${esc(t)}${ico("chevR")}</a>`).join("");
  const tiles = S ? S.tiles : SEC_TILES;
  const tileHref = k => k.startsWith("@") ? k.slice(1) : subHref(k);
  $("[data-tiles]").innerHTML = c === "oblubene" ? "" : tiles.map(([k, h, img, pos]) => `<a class="ktile" href="${tileHref(k)}"><img src="${img}" alt="" style="object-position:${pos}" loading="lazy"><b>${h}</b><span>${ico("arrow")}</span></a>`).join("");
  $("[data-strip-ico]").innerHTML = ico("arrow");
  /* pilulky sa roztiahnu na celý riadok, kým sa zmestia do jedného; keď sa zalomia, ostanú prirodzene široké */
  const subNav = $("[data-subs]");
  const fitSubs = () => { subNav.classList.remove("is-wrap"); const a = subNav.children; if (a.length > 1 && a[a.length - 1].offsetTop > a[0].offsetTop + 4) subNav.classList.add("is-wrap"); };
  fitSubs(); addEventListener("resize", () => { cancelAnimationFrame(fitSubs._r); fitSubs._r = requestAnimationFrame(fitSubs); }); document.fonts?.ready.then(fitSubs);

  /* ---------- varianty hero podľa makiet v hero-mock/ (?hero=a|b|c) ---------- */
  (() => {
    const HV = (qp("hero") || "").toLowerCase();
    if (!["a", "b", "c"].includes(HV) || !isSec || !SEC[sec] || sec === "zdravotnictvo") return;
    const { eur, prodUrl } = DAMI;
    const minP = arr => Math.min(...arr.map(p => p.price).filter(n => n > 0));
    const V = {
      gastro: { id: "chefline-rondon-kratky-rukav-cierny-cvoky", name: "CHEFLINE rondon, krátky rukáv, čierny", h: () => "Rondon, ktorý zvládne celú zmenu.",
        photo: "img/hero/ph-gastro.webp", pos: "70% 40%", cut: "img/hero/cut-chefline.png", label: "Gastro",
        specs: ["Zadný diel z ľahkej sieťoviny", "Zapínanie na cvoky", "Veľkosti 44 – 64"], cta: "Pozrieť rondon", all: ["rondony-a-bluze", "Všetky rondony"] },
      pracovne: { id: "carson-bunda-panska", name: "Bunda CARSON, pánska", h: () => `Zimné bundy od ${eur(minP(catProducts("zimne-bundy")))}`,
        photo: "img/hero/ph-pracovne.webp", pos: "72% 35%", cut: "img/hero/cut-carson.png", label: "Zima na stavbe",
        specs: ["Teplá podšívka a kapucňa", "Reflexné doplnky", "Veľkosti S – 3XL"], cta: "Pozrieť bundu", all: ["zimne-bundy", "Všetky zimné bundy"] },
      obuv: { id: "bezpecnostna-poltopanka-evo-icon-s3s", name: "CXS EVO ICON S3S, poltopánka", h: () => `Bezpečnostná obuv S3 od ${eur(P["bezpecnostna-poltopanka-evo-icon-s3s"].price)}`,
        photo: "img/hero/kat-obuv.webp", pos: "100% 50%", cut: "img/hero/cut-evo-s3s.png", label: "Bezpečnostná obuv",
        specs: ["Kompozitná špica", "Protišmyková, olejovzdorná podošva", "Veľkosti 41 – 46"], cta: "Pozrieť poltopánku", light: 1, all: ["s1-s1p-s3-ocelovou-vystuzou", "Obuv S1 – S3"] },
      doplnky: { id: "rukavice-cxs-industry-roxy-winter-zimni-macene-v-latexu", name: "CXS ROXY WINTER, zimné rukavice", h: () => `Zimné rukavice od ${eur(P["rukavice-cxs-industry-roxy-winter-zimni-macene-v-latexu"].price)}`,
        photo: "img/hero/kat-doplnky.webp", pos: "100% 50%", cut: "img/hero/cut-roxy-winter.png", label: "Zima",
        specs: ["Dlaň máčaná v latexe", "Protišmykový úchop", "Veľkosti 8 a 10"], cta: "Pozrieť rukavice", light: 1, all: ["rukavice", "Všetky rukavice"] },
    }[sec];
    if (!V || !P[V.id]) return;
    const pr = P[V.id], price = eur(pr.price), href = prodUrl(V.id);
    const crumbHtml = `<nav class="crumbs hv-crumbs" aria-label="Omrvinky">${crumbs.map(([h, t], i) => i === crumbs.length - 1 ? `<b>${esc(t)}</b>` : `<a href="${h}">${esc(t)}</a><span>/</span>`).join("")}</nav>`;
    /* podkategórie ako dlaždice s fotkou najlacnejšieho produktu */
    const own = p => !(p.sec || []).includes("zdravotnictvo");
    const tileImg = k => { const ps = catProducts(k).filter(p => base.includes(p) && p.img?.length && own(p) && !/cesare-zdrav|ruzov|pink/i.test(p.id)); return (ps[0] || catProducts(k).find(p => p.img?.length))?.img[0]; };
    const tilesHtml = `<div class="wrap hv-tiles" role="list">${subs.map(k => { const n = base.filter(p => p.cats.includes(k)).length; const im = tileImg(k);
      return `<a class="hv-tile" role="listitem" href="${subHref(k)}"><span class="hv-tile__ph">${im ? `<img src="${im}" alt="" loading="lazy">` : ""}</span><span class="hv-tile__t"><b>${esc(D.cats[k].name)}</b><i>${n}</i></span></a>`; }).join("")}</div>`;
    const btn = (cls, h, t) => `<a class="btn ${cls}" href="${h}">${t} ${ico("arrow")}</a>`;
    let html = "";
    if (HV === "a") {
      html = `<section class="hv hv-a${V.light ? " hv-a--light" : ""}"><img class="hv-a__bg" src="${V.photo}" alt="" style="object-position:${V.pos}" fetchpriority="high">
        <div class="wrap hv-a__in">${crumbHtml}<h1>${esc(title)}</h1>
          <a class="hv-offer" href="${href}"><img src="${V.cut}" alt="${esc(pr.name)}"><span class="hv-offer__t"><b>${esc(V.name)}</b><span class="hv-offer__p">${price}</span><span class="btn btn--red btn--sm">${V.cta} ${ico("arrow")}</span></span></a>
        </div></section>${tilesHtml}`;
    } else if (HV === "b") {
      html = `<section class="hv hv-b"><div class="hv-b__red">${crumbHtml}<h1>${esc(V.h())}</h1>
          <p class="hv-b__name">${esc(V.name)}</p><p class="hv-b__p">${price}</p>
          <div class="hv-b__btns">${btn("btn--white", href, V.cta)}<a class="btn hv-b__ghost" href="${catUrl(V.all[0])}">${V.all[1]}</a></div>
          <p class="hv-b__trust"><span>★ 4,7 Google (42)</span><span>Osobný odber v Piešťanoch zadarmo</span></p>
          <img class="hv-b__hand" src="img/hand-white.png" alt="" width="458" height="600"></div>
        <div class="hv-b__ph"><img src="${V.photo}" alt="" style="object-position:${V.pos}" fetchpriority="high"></div></section>${tilesHtml}`;
    } else {
      const seen = new Set(); const best = subs.map(k => catProducts(k).find(p => base.includes(p) && p.id !== V.id && p.img?.length && p.price > 0 && own(p) && !/cesare-zdrav|ruzov|pink/i.test(p.id))).filter(p => p && !seen.has(p.name.split(" ").slice(0, 2).join(" ")) && seen.add(p.name.split(" ").slice(0, 2).join(" "))).slice(0, 4);
      html = `<section class="wrap hv hv-c"><div class="hv-c__txt">${crumbHtml}<h1>${esc(title)}</h1>
          <p class="hv-c__n"><b>${baseN} ${plural(baseN)}</b> ${esc(tail)}</p>${btn("btn--red", "#kgrid", "Nakupovať")}</div>
        <a class="hv-c__prod" href="${href}"><img src="${V.cut}" alt="${esc(pr.name)}"><span class="hv-c__stk">${price}</span>
          <span class="hv-c__info"><b>${esc(V.name)}</b><ul>${V.specs.map(s => `<li>${esc(s)}</li>`).join("")}</ul></span></a>
        <aside class="hv-c__rail"><h2>Odporúčame</h2>${best.map(p => `<a class="hv-c__item" href="${prodUrl(p.id)}"><span><img src="${p.img[0]}" alt="" loading="lazy"></span><b>${esc(DAMI.shortName(p))}</b><i>${eur(p.price)}</i></a>`).join("")}</aside></section>${tilesHtml}`;
    }
    document.body.classList.add("has-hv", "hv--" + HV);
    $("[data-hero]").insertAdjacentHTML("beforebegin", `<div class="hv-wrap">${html}</div>`);
    $("[data-grid]").id = "kgrid";
    const q2 = new URLSearchParams(location.search);
    document.body.insertAdjacentHTML("beforeend", `<nav class="hv-sw" aria-label="Varianty hero">${["a", "b", "c"].map(x => { q2.set("hero", x); return `<a href="?${q2}" class="${x === HV ? "is-on" : ""}">${x.toUpperCase()}</a>`; }).join("")}</nav>`);
  })();


  /* ---------- fasety ---------- */
  const SIZE_ORDER = ["XXS", "XS", "S", "M", "L", "XL", "XXL", "2XL", "XXXL", "3XL", "4XL", "5XL", "6XL", "7XL"];
  const sizeKey = s => { const i = SIZE_ORDER.indexOf(s.toUpperCase()); if (i >= 0) return i; const n = parseFloat(s); return isNaN(n) ? 999 : 100 + n; };
  const count = (arr, fn) => { const m = new Map(); arr.forEach(p => fn(p).forEach(v => m.set(v, (m.get(v) || 0) + 1))); return m; };
  const brands = [...count(base, p => p.brand ? [p.brand] : [])].sort((a, b) => b[1] - a[1]);
  const sizes = [...count(base, p => p.sizes)].map(([s]) => s).sort((a, b) => sizeKey(a) - sizeKey(b) || a.localeCompare(b, "sk", { numeric: true }));
  const colMap = new Map(); base.forEach(p => p.colors.forEach(cl => { if (cl.h.length === 1) { const e = colMap.get(cl.h[0]) || { h: cl.h[0], n: cl.n, k: 0 }; e.k++; colMap.set(cl.h[0], e); } }));
  const colors = [...colMap.values()].sort((a, b) => b.k - a.k).slice(0, 14);
  const prices = base.map(p => p.price).filter(Boolean);
  const LO = prices.length ? Math.floor(Math.min(...prices)) : 0, HI = prices.length ? Math.ceil(Math.max(...prices)) : 1;
  const light = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 225; };

  /* ---------- stav (z URL) ---------- */
  const PER = 24;
  const list = k => (qp(k) || "").split(",").filter(Boolean);
  const pr = (qp("p") || "").split("-").map(Number);
  const st = {
    cats: list("k").length ? list("k") : (!isSec && D.cats[c] ? [c] : []),
    brands: list("b"), sizes: list("s"), colors: list("f").map(h => "#" + h),
    min: pr[0] >= LO ? pr[0] : LO, max: pr[1] <= HI && pr[1] > 0 ? pr[1] : HI,
    sort: qp("o") || "pop", page: Math.max(1, parseInt(qp("str")) || 1),
  };
  if (!isSec && D.cats[c] && !subs.includes(c)) subs.unshift(c);

  const sideState = { brand: false, size: false };
  function renderSide() {
    const chkList = (items, sel, key) => items.map(([v, lab, n]) => `<label class="chk"><input type="checkbox" data-f="${key}" value="${esc(v)}" ${sel.includes(v) ? "checked" : ""}><span>${esc(lab)}</span><small>${n}</small></label>`).join("");
    const catItems = subs.map(k => [k, D.cats[k].name, base.filter(p => p.cats.includes(k)).length]);
    const br = sideState.brand ? brands : brands.slice(0, 5);
    const sz = sideState.size ? sizes : sizes.slice(0, 12);
    const grp = (id, t, body) => `<div class="fg" data-g="${id}"><button class="fg__hd" data-toggle aria-expanded="true">${t}${ico("chev")}</button><div class="fg__bd">${body}</div></div>`;
    $("[data-side]").innerHTML = `<div class="sheet__hd"><b>Filtre</b><button class="drawer__x" data-sheet-close aria-label="Zavrieť">${ico("x")}</button></div>
      ${sizes.length ? grp("s", "Veľkosť", `<div class="sizes">${sz.map(s => `<button class="sz ${st.sizes.includes(s) ? "is-on" : ""}" data-f="sizes" value="${esc(s)}" aria-pressed="${st.sizes.includes(s)}">${esc(s)}</button>`).join("")}</div>` + (sizes.length > 12 ? `<button class="fg__more" data-more-f="size">${sideState.size ? "Zobraziť menej" : `Všetky veľkosti (${sizes.length})`}</button>` : "")) : ""}
      ${colors.length ? grp("f", "Farba", `<div class="cols">${colors.map(cl => `<button class="cl ${st.colors.includes(cl.h) ? "is-on" : ""} ${light(cl.h) ? "is-light" : ""}" data-f="colors" value="${cl.h}" title="${esc(cl.n)}" aria-label="${esc(cl.n)}" aria-pressed="${st.colors.includes(cl.h)}" style="background:${cl.h}"></button>`).join("")}</div>`) : ""}
      ${brands.length ? grp("b", "Značka", chkList(br.map(([b, n]) => [b, b, n]), st.brands, "brands") + (brands.length > 5 ? `<button class="fg__more" data-more-f="brand">${sideState.brand ? "Zobraziť menej" : `Všetky značky (${brands.length})`}</button>` : "")) : ""}
      ${prices.length ? grp("p", "Cena", `<div class="range__val"><span data-rv="min"></span><span data-rv="max"></span></div>
          <div class="range"><div class="range__track"></div><div class="range__fill" data-fill></div>
          <input type="range" min="${LO}" max="${HI}" value="${st.min}" data-r="min" aria-label="Cena od"><input type="range" min="${LO}" max="${HI}" value="${st.max}" data-r="max" aria-label="Cena do"></div>`) : ""}
      ${catItems.length > 1 ? grp("k", "Kategórie", chkList(catItems, st.cats, "cats")) : ""}
      <button class="side__reset" data-reset>Zrušiť všetky filtre</button>
      <div class="sheet__ft"><button class="btn btn--red btn--block" data-sheet-close data-sheet-count></button></div>`;
    paintRange();
  }
  function paintRange() {
    const f = $("[data-fill]"); if (!f) return;
    const w = HI - LO || 1;
    f.style.left = (st.min - LO) / w * 100 + "%"; f.style.right = (HI - st.max) / w * 100 + "%";
    $('[data-rv="min"]').textContent = `${st.min} €`; $('[data-rv="max"]').textContent = `${st.max} €`;
  }

  /* ---------- filtrovanie ---------- */
  const active = () => st.cats.length + st.brands.length + st.sizes.length + st.colors.length + (st.min > LO || st.max < HI ? 1 : 0);
  function filtered() {
    let r = base.filter(p =>
      (!st.cats.length || st.cats.some(k => p.cats.includes(k))) &&
      (!st.brands.length || st.brands.includes(p.brand)) &&
      (!st.sizes.length || st.sizes.some(s => p.sizes.includes(s))) &&
      (!st.colors.length || p.colors.some(cl => st.colors.includes(cl.h[0]))) &&
      (!p.price || (p.price >= st.min && p.price <= st.max)));
    const cmp = { asc: (a, b) => (a.price || 1e9) - (b.price || 1e9), desc: (a, b) => b.price - a.price, name: (a, b) => a.name.localeCompare(b.name, "sk") }[st.sort];
    return cmp ? [...r].sort(cmp) : r;
  }
  function pager(cur, pages) {
    if (pages < 2) return "";
    let nums = [];
    if (pages <= 7) nums = Array.from({ length: pages }, (_, i) => i + 1);
    else {
      const lo = Math.max(2, Math.min(cur - 1, pages - 4)), hi = Math.min(pages - 1, Math.max(cur + 1, 5));
      nums = [1, ...(lo > 2 ? ["…"] : []), ...Array.from({ length: hi - lo + 1 }, (_, i) => lo + i), ...(hi < pages - 1 ? ["…"] : []), pages];
    }
    return `<button class="pager__b" data-page="${cur - 1}" ${cur === 1 ? "disabled" : ""} aria-label="Predchádzajúca strana">${ico("chevL")}</button>
      ${nums.map(n => n === "…" ? `<span class="pager__gap">…</span>` : `<button class="pager__b ${n === cur ? "is-on" : ""}" data-page="${n}" ${n === cur ? 'aria-current="page"' : ""}>${n}</button>`).join("")}
      <button class="pager__b" data-page="${cur + 1}" ${cur === pages ? "disabled" : ""} aria-label="Ďalšia strana">${ico("chevR")}</button>`;
  }
  function render() {
    const r = filtered();
    const pages = Math.max(1, Math.ceil(r.length / PER));
    st.page = Math.min(st.page, pages);
    const from = (st.page - 1) * PER;
    $("[data-count]").textContent = r.length > PER ? `${from + 1} – ${Math.min(from + PER, r.length)} z ${r.length} ${plural(r.length)}` : `${r.length} ${plural(r.length)}`;
    const n = active();
    $("[data-sheet-open]").innerHTML = `${FUNNEL}<span>Filtrovať${n ? ` (${n})` : ""}</span>`;
    const sc = $("[data-sheet-count]"); if (sc) sc.textContent = `Zobraziť ${r.length} ${plural(r.length)}`;
    $("[data-reset]")?.classList.toggle("is-on", n > 0);
    $("[data-sort]").value = st.sort;
    $("[data-grid]").innerHTML = r.length ? r.slice(from, from + PER).map(p => card(p, { add: true, noSw: true })).join("") :
      `<div class="empty" style="grid-column:1/-1"><h3>${c === "oblubene" ? "Zatiaľ nemáš obľúbené produkty" : "Nič sme nenašli"}</h3><p class="muted">${c === "oblubene" ? "Klikni na srdiečko pri produkte a uložíš si ho sem." : `Skús zrušiť niektorý filter alebo nám zavolaj na ${FIRM.phone}. Radi poradíme.`}</p>${n ? `<button class="btn btn--line btn--sm" data-reset>Zrušiť filtre</button>` : `<a class="btn btn--red btn--sm" href="${catUrl("gastro")}">Pozrieť kolekcie</a>`}</div>`;
    $("[data-pager]").innerHTML = pager(st.page, pages);
    const chips = [
      ...st.cats.filter(v => isSec || v !== c).map(v => ["cats", v, D.cats[v]?.name || v]), ...st.brands.map(v => ["brands", v, v]), ...st.sizes.map(v => ["sizes", v, "Veľkosť " + v]),
      ...st.colors.map(v => ["colors", v, colMap.get(v)?.n || "Farba"]),
      ...(st.min > LO || st.max < HI ? [["price", "", `${st.min} – ${st.max} €`]] : [])];
    $("[data-chips]").innerHTML = chips.length ? chips.map(([k, v, t]) => `<button class="chip" data-chip="${k}" value="${esc(v)}">${esc(t)} ${ico("x")}</button>`).join("") + (chips.length > 1 ? `<button class="chip chip--reset" data-reset>Zrušiť všetko</button>` : "") : "";
    writeUrl();
  }
  function writeUrl() {
    const u = new URLSearchParams(); u.set("c", c); if (q) u.set("q", q);
    const def = !isSec && D.cats[c] && st.cats.length === 1 && st.cats[0] === c;
    if (st.cats.length && !def) u.set("k", st.cats.join(","));
    if (st.brands.length) u.set("b", st.brands.join(",")); if (st.sizes.length) u.set("s", st.sizes.join(","));
    if (st.colors.length) u.set("f", st.colors.map(h => h.slice(1)).join(","));
    if (st.min > LO || st.max < HI) u.set("p", `${st.min}-${st.max}`);
    if (st.sort !== "pop") u.set("o", st.sort); if (st.page > 1) u.set("str", st.page);
    try { history.replaceState(null, "", "?" + u.toString().replace(/%2C/g, ",")); } catch {}
  }
  const toggle = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };
  const refilter = () => { st.page = 1; render(); };

  /* ---------- udalosti ---------- */
  const side = $("[data-side]");
  side.addEventListener("change", e => { const t = e.target; if (t.dataset.f) { toggle(st[t.dataset.f], t.value); refilter(); } });
  side.addEventListener("input", e => {
    const t = e.target; if (!t.dataset.r) return;
    let v = +t.value;
    if (t.dataset.r === "min") { v = Math.min(v, st.max - 1); st.min = v; } else { v = Math.max(v, st.min + 1); st.max = v; }
    t.value = v; paintRange(); clearTimeout(side._t); side._t = setTimeout(refilter, 120);
  });
  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-sheet-close]"); if (!t) return;
    if (t.matches(".sz, .cl")) { toggle(st[t.dataset.f], t.value); const on = t.classList.toggle("is-on"); t.setAttribute("aria-pressed", on); refilter(); }
    else if (t.matches("[data-toggle]")) { const g = t.parentElement; g.classList.toggle("is-closed"); t.setAttribute("aria-expanded", !g.classList.contains("is-closed")); }
    else if (t.matches("[data-more-f]")) { sideState[t.dataset.moreF] = !sideState[t.dataset.moreF]; renderSide(); }
    else if (t.matches("[data-reset]")) { Object.assign(st, { cats: !isSec && D.cats[c] ? [c] : [], brands: [], sizes: [], colors: [], min: LO, max: HI, page: 1 }); renderSide(); render(); }
    else if (t.matches("[data-chip]")) { const k = t.dataset.chip; k === "price" ? (st.min = LO, st.max = HI) : toggle(st[k], t.value); renderSide(); refilter(); }
    else if (t.matches("[data-page]")) { st.page = +t.dataset.page; render(); const top = $(".cat").getBoundingClientRect().top + scrollY - 90; if (scrollY > top) scrollTo({ top, behavior: "smooth" }); }
    else if (t.matches("[data-sheet-open]")) document.body.classList.add("sheet-open");
    if (t.matches("[data-sheet-close]")) document.body.classList.remove("sheet-open");
  });
  $("[data-sort]").addEventListener("change", e => { st.sort = e.target.value; refilter(); });
  $(".sort").insertAdjacentHTML("beforeend", ico("chev", "ico sort__chev"));

  renderSide(); render();
})();
</script>
<script>DAMI.mountFooter()</script>
</body>
</html>
